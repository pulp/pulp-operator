---
apiVersion: repo-manager.pulpproject.org/v1
kind: Pulp
metadata:
  name: example-pulp
spec:
  # override the hardcoded runAsUser/fsGroup 700 for a custom image that
  # runs its pulp user under a different UID/GID
  api:
    pod_security_context:
      runAsUser: 101
      fsGroup: 101
  content:
    pod_security_context:
      runAsUser: 101
      fsGroup: 101
  worker:
    pod_security_context:
      runAsUser: 101
      fsGroup: 101
  web:
    pod_security_context:
      runAsUser: 101
      fsGroup: 101

  database:
    postgres_image: postgres:15
    postgres_storage_class: standard

  file_storage_storage_class: standard
  file_storage_access_mode: "ReadWriteMany"
  file_storage_size: "2Gi"
